name: Build Tetris

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            artifact: eclipse-tetris-macos
          - name: Linux
            os: ubuntu-22.04
            artifact: eclipse-tetris-linux
          - name: Windows
            os: windows-2022
            artifact: eclipse-tetris-windows

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: abdes/gha-setup-premake@v3
        with:
          version: "5.0.0-beta2"

      - name: Initialize MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 glm freetype

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev libglm-dev libfreetype6-dev libgl1-mesa-dev patchelf

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install --triplet=x64-windows

      - name: Generate (macOS)
        if: runner.os == 'macOS'
        run: >-
          premake5 --file=premake5.lua
          --sdl2-root="$(brew --prefix sdl2)"
          --glm-root="$(brew --prefix glm)"
          --freetype-root="$(brew --prefix freetype)"
          --python=python3 gmake

      - name: Generate (Linux)
        if: runner.os == 'Linux'
        run: premake5 --file=premake5.lua --sdl2-root=/usr --glm-root=/usr --freetype-root=/usr --python=python3 gmake

      - name: Generate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deps = "$pwd\vcpkg_installed\x64-windows"
          premake5 --file=premake5.lua --sdl2-root="$deps" --glm-root="$deps" --freetype-root="$deps" --python=python vs2022

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: make -C build/gmake config=release

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: msbuild build\vs2022\eclipse.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: ./bin/Release/eclipsetests/eclipsetests

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$pwd\vcpkg_installed\x64-windows\bin;$env:PATH"
          .\bin\Release\eclipsetests\eclipsetests.exe

      - name: Stage package
        shell: bash
        run: |
          mkdir -p dist
          cp -R bin/Release/tetrisgame/assets dist/assets
          cp README.md dist/README.md
          cp external/box2d/LICENSE dist/BOX2D_LICENSE
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp bin/Release/tetrisgame/tetrisgame.exe dist/tetrisgame.exe
            cp vcpkg_installed/x64-windows/bin/*.dll dist/
          else
            cp bin/Release/tetrisgame/tetrisgame dist/tetrisgame
          fi

      - name: Bundle SDL on macOS
        if: runner.os == 'macOS'
        run: |
          SDL_LIB="$(brew --prefix sdl2)/lib/libSDL2-2.0.0.dylib"
          cp "$SDL_LIB" dist/libSDL2-2.0.0.dylib
          install_name_tool -change "$SDL_LIB" @executable_path/libSDL2-2.0.0.dylib dist/tetrisgame
          install_name_tool -id @executable_path/libSDL2-2.0.0.dylib dist/libSDL2-2.0.0.dylib
          codesign --force --sign - dist/libSDL2-2.0.0.dylib
          codesign --force --sign - dist/tetrisgame

      - name: Bundle SDL on Linux
        if: runner.os == 'Linux'
        run: |
          SDL_LIB="$(ldd dist/tetrisgame | awk '/libSDL2/{print $3; exit}')"
          test -n "$SDL_LIB"
          cp "$SDL_LIB" dist/
          patchelf --set-rpath '$ORIGIN' dist/tetrisgame

      - name: Verify package contents
        shell: bash
        run: |
          test -f dist/assets/manifest.json
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -f dist/tetrisgame.exe
            test -f dist/SDL2.dll
          else
            test -x dist/tetrisgame
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
